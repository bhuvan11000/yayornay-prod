[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API function routing
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA catch-all — all unmatched routes serve index.html for client-side routing
# In production, real files (assets) are served before this redirect is checked
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

  # Set timeout for AI-related functions that call Gemini
  [functions.generate-markets]
    timeout = 30
  [functions.resolve]
    timeout = 30
