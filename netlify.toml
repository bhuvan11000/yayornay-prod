[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API function routing
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA catch-all is in public/_redirects (only active in production builds,
# not during netlify dev — Vite handles SPA routing in development)

[functions]
  node_bundler = "esbuild"

  # Set timeout for AI-related functions that call Gemini
  [functions.generate-markets]
    timeout = 30
  [functions.season-transition]
    timeout = 30
  [functions.publish-markets]
    timeout = 10
