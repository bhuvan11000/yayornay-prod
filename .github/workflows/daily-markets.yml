name: Generate Daily Markets
on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily
  workflow_dispatch:       # manual trigger for testing

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger market generation
        run: |
          curl -X POST "${{ secrets.NETLIFY_SITE_URL }}/api/generate-markets" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --fail-with-body \
            --max-time 60
