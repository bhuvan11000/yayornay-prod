name: Purge Expired Markets
on:
  schedule:
    - cron: '0 3 * * *'    # Daily 03:00 UTC
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger market purge
        run: |
          curl -X POST "${{ secrets.NETLIFY_SITE_URL }}/api/purge-expired-markets" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --fail-with-body \
            --max-time 30
